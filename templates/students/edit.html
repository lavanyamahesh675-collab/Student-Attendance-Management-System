{% extends "base.html" %}

{% block title %}Edit Student - Student Attendance Management System{% endblock %}
{% block page_title %}Edit Student Details{% endblock %}

{% block content %}
<div class="card-box" style="max-width: 700px; margin: 0 auto;">
    <div class="card-header">
        <h2>✏️ Edit Student ({{ student.roll_number }})</h2>
        <a href="{{ url_for('list_students') }}" class="btn btn-secondary btn-sm">Back to List</a>
    </div>

    <form id="studentForm" method="POST" action="{{ url_for('edit_student', student_id=student.student_id) }}">
        <div class="form-grid">
            <div class="form-group">
                <label for="roll_number">Roll Number *</label>
                <input type="text" id="roll_number" name="roll_number" class="form-control" value="{{ student.roll_number }}" required>
            </div>

            <div class="form-group">
                <label for="name">Full Name *</label>
                <input type="text" id="name" name="name" class="form-control" value="{{ student.name }}" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address *</label>
                <input type="email" id="email" name="email" class="form-control" value="{{ student.email }}" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="text" id="phone" name="phone" class="form-control" value="{{ student.phone or '' }}">
            </div>

            <div class="form-group">
                <label for="department">Department *</label>
                <select id="department" name="department" class="form-control" required>
                    <option value="CSM" {% if student.department == 'CSM' %}selected{% endif %}>CSM (AI & ML)</option>
                    <option value="CSE" {% if student.department == 'CSE' %}selected{% endif %}>CSE (Computer Science)</option>
                    <option value="ECE" {% if student.department == 'ECE' %}selected{% endif %}>ECE (Electronics)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="year">Year *</label>
                <select id="year" name="year" class="form-control" required>
                    <option value="1" {% if student.year == 1 %}selected{% endif %}>1st Year</option>
                    <option value="2" {% if student.year == 2 %}selected{% endif %}>2nd Year</option>
                    <option value="3" {% if student.year == 3 %}selected{% endif %}>3rd Year</option>
                    <option value="4" {% if student.year == 4 %}selected{% endif %}>4th Year</option>
                </select>
            </div>

            <div class="form-group">
                <label for="section">Section *</label>
                <select id="section" name="section" class="form-control" required>
                    <option value="A" {% if student.section == 'A' %}selected{% endif %}>Section A</option>
                    <option value="B" {% if student.section == 'B' %}selected{% endif %}>Section B</option>
                    <option value="C" {% if student.section == 'C' %}selected{% endif %}>Section C</option>
                </select>
            </div>

            <div class="form-group">
                <label for="batch">Academic Batch</label>
                <input type="text" id="batch" name="batch" class="form-control" value="{{ student.batch or '' }}">
            </div>
        </div>

        <div style="margin-top: 1.5rem; display: flex; gap: 1rem;">
            <button type="submit" class="btn btn-primary">Update Student</button>
            <a href="{{ url_for('list_students') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
