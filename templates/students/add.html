{% extends "base.html" %}

{% block title %}Add Student - Student Attendance Management System{% endblock %}
{% block page_title %}Add New Student{% endblock %}

{% block content %}
<div class="card-box" style="max-width: 700px; margin: 0 auto;">
    <div class="card-header">
        <h2>➕ Register New Student</h2>
        <a href="{{ url_for('list_students') }}" class="btn btn-secondary btn-sm">Back to List</a>
    </div>

    <form id="studentForm" method="POST" action="{{ url_for('add_student') }}">
        <div class="form-grid">
            <div class="form-group">
                <label for="roll_number">Roll Number *</label>
                <input type="text" id="roll_number" name="roll_number" class="form-control" placeholder="e.g. 101" required>
            </div>

            <div class="form-group">
                <label for="name">Full Name *</label>
                <input type="text" id="name" name="name" class="form-control" placeholder="e.g. Ravi Kumar" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address *</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="e.g. ravi@college.edu" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="text" id="phone" name="phone" class="form-control" placeholder="e.g. 9876543210">
            </div>

            <div class="form-group">
                <label for="department">Department *</label>
                <select id="department" name="department" class="form-control" required>
                    <option value="">-- Select Department --</option>
                    <option value="CSM">CSM (AI & ML)</option>
                    <option value="CSE">CSE (Computer Science)</option>
                    <option value="ECE">ECE (Electronics)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="year">Year *</label>
                <select id="year" name="year" class="form-control" required>
                    <option value="1">1st Year</option>
                    <option value="2" selected>2nd Year</option>
                    <option value="3">3rd Year</option>
                    <option value="4">4th Year</option>
                </select>
            </div>

            <div class="form-group">
                <label for="section">Section *</label>
                <select id="section" name="section" class="form-control" required>
                    <option value="A">Section A</option>
                    <option value="B">Section B</option>
                    <option value="C">Section C</option>
                </select>
            </div>

            <div class="form-group">
                <label for="batch">Academic Batch</label>
                <input type="text" id="batch" name="batch" class="form-control" value="2023-2027" placeholder="e.g. 2023-2027">
            </div>
        </div>

        <div style="margin-top: 1.5rem; display: flex; gap: 1rem;">
            <button type="submit" class="btn btn-primary">Save Student</button>
            <a href="{{ url_for('list_students') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
