{% extends "base.html" %}

{% block title %}Add Subject - Student Attendance Management System{% endblock %}
{% block page_title %}Add New Subject{% endblock %}

{% block content %}
<div class="card-box" style="max-width: 600px; margin: 0 auto;">
    <div class="card-header">
        <h2>📚 Add Subject</h2>
        <a href="{{ url_for('list_subjects') }}" class="btn btn-secondary btn-sm">Back to List</a>
    </div>

    <form id="subjectForm" method="POST" action="{{ url_for('add_subject') }}">
        <div class="form-group">
            <label for="subject_code">Subject Code *</label>
            <input type="text" id="subject_code" name="subject_code" class="form-control" placeholder="e.g. CS301" required>
        </div>

        <div class="form-group">
            <label for="subject_name">Subject Name *</label>
            <input type="text" id="subject_name" name="subject_name" class="form-control" placeholder="e.g. Database Management Systems" required>
        </div>

        <div class="form-group">
            <label for="semester">Semester (1 - 8) *</label>
            <input type="number" id="semester" name="semester" class="form-control" min="1" max="8" value="4" required>
        </div>

        <div class="form-group">
            <label for="faculty_id">Assigned Faculty Member</label>
            <select id="faculty_id" name="faculty_id" class="form-control">
                <option value="">-- Select Faculty --</option>
                {% for fac in faculty_members %}
                <option value="{{ fac.user_id }}">{{ fac.name }} ({{ fac.email }})</option>
                {% endfor %}
            </select>
        </div>

        <div style="margin-top: 1.5rem; display: flex; gap: 1rem;">
            <button type="submit" class="btn btn-primary">Save Subject</button>
            <a href="{{ url_for('list_subjects') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
